[project]
name = "twin"
version = "0.1.0"
description = "AI Financial Twin – regime-switching SDE engine (LauzHack 2026)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "streamlit>=1.40", "plotly>=5.24"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
twin = "twin.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["twin"]
